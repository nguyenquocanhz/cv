e-linecap="round"/><rect x="306" y="124" width="22" height="16" rx="2" fill="#374151" stroke="#111827" stroke-width="1"/><circle cx="480" cy="385" r="22" fill="#9CA3AF" stroke="#4B5563" stroke-width="1.5"/><rect x="90" y="430" width="210" height="14" rx="2" fill="#D4A017" stroke="#A67C00" stroke-width="1"/><circle cx="170" cy="110" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="170" y="110.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">1</text><circle cx="270" cy="244" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="270" y="244.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">2</text><circle cx="344" cy="112" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="344" y="112.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">3</text><circle cx="420" cy="280" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="420" y="280.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">4</text><circle cx="548" cy="395" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="548" y="395.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">5</text><circle cx="320" cy="444" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="320" y="444.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">6</text><circle cx="610" cy="50" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="610" y="50.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">1</text><text x="632" y="41.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Đĩa từ (platter)</text><text x="632" y="62.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">phủ lớp từ tính; dữ liệu nằm trên các rãnh (track)</text><circle cx="610" cy="108" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="610" y="108.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">2</text><text x="632" y="99.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Trục quay (spindle)</text><text x="632" y="120.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">5.400 hoặc 7.200 vòng/phút</text><circle cx="610" cy="166" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="610" y="166.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">3</text><text x="632" y="157.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Đầu đọc/ghi</text><text x="632" y="178.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">bay cách mặt đĩa chỉ vài nanomet</text><circle cx="610" cy="224" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="610" y="224.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">4</text><text x="632" y="215.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Cần gạt (actuator arm)</text><text x="632" y="236.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">đưa đầu đọc tới đúng rãnh</text><circle cx="610" cy="282" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="610" y="282.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">5</text><text x="632" y="273.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Cuộn cảm động</text><text x="632" y="294.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">(voice coil) điều khiển cần gạt</text><circle cx="610" cy="340" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="610" y="340.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">6</text><text x="632" y="331.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Cổng SATA</text><text x="632" y="352.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">mặt dưới có bo mạch điều khiển + cache</text><rect x="600" y="395" width="420" height="60" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/><text x="810.0" y="416.5" font-size="14" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Vì sao HDD sợ va đập?</text><text x="810.0" y="433.8" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">đầu đọc chạm mặt đĩa → bad sector, hỏng cơ</text></svg>