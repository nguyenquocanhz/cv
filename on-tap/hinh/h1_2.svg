<svg xmlns="http://www.w3.org/2000/svg" width="990" height="480" viewBox="0 0 990 480" font-family="'Liberation Sans', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><rect width="990" height="480" fill="#ffffff"/><polygon points="310.0,50 410.0,50 456.0,119 264.0,119" fill="#1F4E79"/><text x="360" y="86.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Thanh ghi</text><text x="660" y="75.0" font-size="16" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">~0,3 ns</text><text x="660" y="97.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">vài trăm byte, nằm trong nhân CPU</text><line x1="464.0" y1="86.0" x2="648" y2="86.0" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3 3"/><polygon points="264.0,122 456.0,122 502.0,191 218.0,191" fill="#2B6CB0"/><text x="360" y="158.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Cache L1 · L2 · L3</text><text x="660" y="147.0" font-size="16" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">~1 – 20 ns</text><text x="660" y="169.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">vài MB đến ~100 MB, nằm trong CPU</text><line x1="510.0" y1="158.0" x2="648" y2="158.0" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3 3"/><polygon points="218.0,194 502.0,194 548.0,263 172.0,263" fill="#3B82F6"/><text x="360" y="230.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">RAM</text><text x="660" y="219.0" font-size="16" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">~60 – 100 ns</text><text x="660" y="241.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">8 – 128 GB trên máy phổ thông</text><line x1="556.0" y1="230.0" x2="648" y2="230.0" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3 3"/><polygon points="172.0,266 548.0,266 594.0,335 126.0,335" fill="#93C5FD"/><text x="360" y="302.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">SSD</text><text x="660" y="291.0" font-size="16" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">~50 – 100 µs</text><text x="660" y="313.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">256 GB – 4 TB</text><line x1="602.0" y1="302.0" x2="648" y2="302.0" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3 3"/><polygon points="126.0,338 594.0,338 640.0,407 80.0,407" fill="#DBEAFE"/><text x="360" y="374.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">HDD</text><text x="660" y="363.0" font-size="16" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">~5 – 10 ms</text><text x="660" y="385.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">1 – 20+ TB</text><line x1="648.0" y1="374.0" x2="648" y2="374.0" stroke="#BFBFBF" stroke-width="1" stroke-dasharray="3 3"/><line x1="40" y1="395" x2="40" y2="55" stroke="#2563EB" stroke-width="2.5" marker-end="url(#aha)"/><text x="40" y="30.0" font-size="13" fill="#2563EB" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Nhanh · đắt · nhỏ</text><text x="40" y="420.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Chậm · rẻ · dung lượng lớn</text><text x="660" y="30.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="italic" dominant-baseline="central">Độ trễ tham khảo · dung lượng thường gặp</text><line x1="935" y1="54" x2="935" y2="260" stroke="#C2410C" stroke-width="2"/><line x1="927" y1="54" x2="935" y2="54" stroke="#C2410C" stroke-width="2"/><line x1="927" y1="260" x2="935" y2="260" stroke="#C2410C" stroke-width="2"/><text x="958" y="158.0" font-size="13" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central" transform="rotate(90 958 158.0)">Mất khi tắt nguồn</text><line x1="935" y1="270" x2="935" y2="404" stroke="#15803D" stroke-width="2"/><line x1="927" y1="270" x2="935" y2="270" stroke="#15803D" stroke-width="2"/><line x1="927" y1="404" x2="935" y2="404" stroke="#15803D" stroke-width="2"/><text x="958" y="338.0" font-size="13" fill="#15803D" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central" transform="rotate(90 958 338)">Giữ khi tắt</text><text x="495" y="455.0" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="italic" dominant-baseline="central">Tầng càng cao càng nhanh nhưng càng đắt trên mỗi GB — máy tính kết hợp nhiều tầng để vừa nhanh vừa rẻ.</text></svg>