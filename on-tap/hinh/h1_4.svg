<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" font-family="'Liberation Sans', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><rect width="1040" height="440" fill="#ffffff"/><rect x="20" y="30" width="220" height="110" rx="8" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="130.0" y="68.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Nhấn nút nguồn</text><text x="130.0" y="86.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">mainboard bật PSU</text><text x="130.0" y="103.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">qua tín hiệu PS_ON</text><circle cx="38" cy="48" r="12" fill="#1F4E79" stroke="#fff" stroke-width="2"/><text x="38" y="48.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">1</text><rect x="280" y="30" width="220" height="110" rx="8" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="390.0" y="68.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">PSU cấp điện</text><text x="390.0" y="86.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">báo nguồn ổn định</text><text x="390.0" y="103.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">(Power Good)</text><circle cx="298" cy="48" r="12" fill="#1F4E79" stroke="#fff" stroke-width="2"/><text x="298" y="48.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">2</text><rect x="540" y="30" width="220" height="110" rx="8" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="650.0" y="68.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">CPU chạy UEFI/BIOS</text><text x="650.0" y="86.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">mã nạp từ chip flash</text><text x="650.0" y="103.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">trên mainboard</text><circle cx="558" cy="48" r="12" fill="#1F4E79" stroke="#fff" stroke-width="2"/><text x="558" y="48.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">3</text><rect x="800" y="30" width="220" height="110" rx="8" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="910.0" y="68.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">POST</text><text x="910.0" y="86.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">tự kiểm tra CPU,</text><text x="910.0" y="103.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">RAM, card hình</text><circle cx="818" cy="48" r="12" fill="#1F4E79" stroke="#fff" stroke-width="2"/><text x="818" y="48.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">4</text><rect x="800" y="215" width="220" height="110" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="910.0" y="253.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Khởi tạo thiết bị</text><text x="910.0" y="271.6" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">đọc cấu hình đã lưu</text><text x="910.0" y="288.4" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">(CMOS / NVRAM)</text><circle cx="818" cy="233" r="12" fill="#1F4E79" stroke="#fff" stroke-width="2"/><text x="818" y="233.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">5</text><rect x="540" y="215" width="220" height="110" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="650.0" y="253.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Chọn ổ khởi động</text><text x="650.0" y="271.6" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">theo thứ tự</text><text x="650.0" y="288.4" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Boot Order</text><circle cx="558" cy="233" r="12" fill="#1F4E79" stroke="#fff" stroke-width="2"/><text x="558" y="233.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">6</text><rect x="280" y="215" width="220" height="110" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="390.0" y="253.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Nạp bootloader</text><text x="390.0" y="271.6" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">UEFI: phân vùng EFI</text><text x="390.0" y="288.4" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Legacy: sector MBR</text><circle cx="298" cy="233" r="12" fill="#1F4E79" stroke="#fff" stroke-width="2"/><text x="298" y="233.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">7</text><rect x="20" y="215" width="220" height="110" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="130.0" y="253.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Nạp hệ điều hành</text><text x="130.0" y="271.6" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Windows Boot Manager</text><text x="130.0" y="288.4" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">→ nhân Windows</text><circle cx="38" cy="233" r="12" fill="#1F4E79" stroke="#fff" stroke-width="2"/><text x="38" y="233.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">8</text><line x1="242" y1="85" x2="278" y2="85" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><line x1="798" y1="270" x2="762" y2="270" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><line x1="502" y1="85" x2="538" y2="85" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><line x1="538" y1="270" x2="502" y2="270" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><line x1="762" y1="85" x2="798" y2="85" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><line x1="278" y1="270" x2="242" y2="270" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><line x1="910" y1="142" x2="910" y2="213" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><rect x="20" y="355" width="490" height="70" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/><text x="265.0" y="373.0" font-size="15" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Hỏng ở bước 4</text><text x="265.0" y="390.9" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">tiếng bíp hoặc đèn debug CPU / DRAM / VGA / BOOT</text><text x="265.0" y="407.8" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">sáng đứng — tra mã trong sách hướng dẫn</text><rect x="530" y="355" width="490" height="70" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/><text x="775.0" y="373.0" font-size="15" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Hỏng ở bước 6 – 7</text><text x="775.0" y="390.9" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">"No bootable device", "Reboot and select proper</text><text x="775.0" y="407.8" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">boot device" — sai Boot Order, ổ hỏng, sai UEFI/Legacy</text></svg>