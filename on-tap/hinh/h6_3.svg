<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Liberation Sans', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><rect width="1000" height="430" fill="#ffffff"/><rect x="110" y="20" width="180" height="66" rx="8" fill="#F2F2F2" stroke="#1F4E79" stroke-width="1.5"/><text x="200.0" y="44.5" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Máy tính</text><text x="200.0" y="63.0" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">chưa có địa chỉ IP</text><rect x="710" y="20" width="180" height="66" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="800.0" y="44.5" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">DHCP server</text><text x="800.0" y="63.0" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">thường là router</text><line x1="200" y1="88" x2="200" y2="360" stroke="#52514E" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="800" y1="88" x2="800" y2="360" stroke="#52514E" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="205" y1="130" x2="795" y2="130" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><text x="500" y="100.0" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">1. DISCOVER</text><text x="500" y="117.0" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">"Có DHCP server nào không?" (gửi quảng bá)</text><line x1="795" y1="195" x2="205" y2="195" stroke="#2563EB" stroke-width="2" marker-end="url(#aha)"/><text x="500" y="165.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">2. OFFER</text><text x="500" y="182.0" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">"Dùng địa chỉ 192.168.1.23 nhé"</text><line x1="205" y1="260" x2="795" y2="260" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><text x="500" y="230.0" font-size="14" fill="#1F4E79" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">3. REQUEST</text><text x="500" y="247.0" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">"Tôi xin nhận 192.168.1.23"</text><line x1="795" y1="325" x2="205" y2="325" stroke="#2563EB" stroke-width="2" marker-end="url(#aha)"/><text x="500" y="295.0" font-size="14" fill="#2563EB" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">4. ACK</text><text x="500" y="312.0" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">"Đồng ý: IP, subnet mask, gateway, DNS, thời hạn thuê"</text><text x="500" y="400.0" font-size="14" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Không nhận được OFFER → Windows tự đặt 169.254.x.x (APIPA) → không vào được mạng.</text></svg>