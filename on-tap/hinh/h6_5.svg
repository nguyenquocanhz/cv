<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" font-family="'Liberation Sans', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><rect width="1000" height="960" fill="#ffffff"/><rect x="100" y="20" width="300" height="56" rx="8" fill="#1F4E79" stroke="#1F4E79" stroke-width="1.5"/><text x="250.0" y="47.9" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Máy không vào được mạng</text><line x1="250" y1="78" x2="250" y2="93" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><polygon points="250,95 410,150 250,205 90,150" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="250" y="140.6" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Đèn mạng sáng / có</text><text x="250" y="159.5" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">biểu tượng kết nối?</text><line x1="412" y1="150" x2="518" y2="150" stroke="#C2410C" stroke-width="2" marker-end="url(#aho)"/><text x="440" y="136.0" font-size="13" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Không</text><rect x="520" y="112" width="460" height="76" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/><text x="750" y="140.2" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Kiểm tra cáp, cổng switch, đã bật Wi-Fi chưa,</text><text x="750" y="159.8" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">driver card mạng (Device Manager)</text><line x1="250" y1="207" x2="250" y2="243" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><text x="262" y="225.0" font-size="13" fill="#15803D" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Có</text><polygon points="250,245 410,300 250,355 90,300" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="250" y="290.6" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">ipconfig: IP có dạng</text><text x="250" y="309.4" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">169.254.x.x?</text><line x1="412" y1="300" x2="518" y2="300" stroke="#C2410C" stroke-width="2" marker-end="url(#aho)"/><text x="440" y="286.0" font-size="13" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Có</text><rect x="520" y="262" width="460" height="76" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/><text x="750" y="290.2" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Lỗi DHCP: ipconfig /release rồi /renew,</text><text x="750" y="309.8" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">khởi động lại router, kiểm tra cáp</text><line x1="250" y1="357" x2="250" y2="393" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><text x="262" y="375.0" font-size="13" fill="#15803D" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Không</text><polygon points="250,395 410,450 250,505 90,450" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="250" y="440.6" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">ping gateway</text><text x="250" y="459.4" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">(vd. 192.168.1.1) được?</text><line x1="412" y1="450" x2="518" y2="450" stroke="#C2410C" stroke-width="2" marker-end="url(#aho)"/><text x="440" y="436.0" font-size="13" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Không</text><rect x="520" y="412" width="460" height="76" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/><text x="750" y="440.2" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Lỗi mạng nội bộ: cáp, switch, IP tĩnh sai</text><text x="750" y="459.8" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">lớp mạng, tường lửa chặn</text><line x1="250" y1="507" x2="250" y2="543" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><text x="262" y="525.0" font-size="13" fill="#15803D" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Có</text><polygon points="250,545 410,600 250,655 90,600" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="250" y="590.5" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">ping 8.8.8.8</text><text x="250" y="609.4" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">được?</text><line x1="412" y1="600" x2="518" y2="600" stroke="#C2410C" stroke-width="2" marker-end="url(#aho)"/><text x="440" y="586.0" font-size="13" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Không</text><rect x="520" y="562" width="460" height="76" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/><text x="750" y="590.2" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Router không ra được Internet: kiểm tra</text><text x="750" y="609.8" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">modem quang (đèn LOS đỏ), gọi nhà mạng</text><line x1="250" y1="657" x2="250" y2="693" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><text x="262" y="675.0" font-size="13" fill="#15803D" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Có</text><polygon points="250,695 410,750 250,805 90,750" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="250" y="740.5" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">ping google.com</text><text x="250" y="759.4" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">được?</text><line x1="412" y1="750" x2="518" y2="750" stroke="#C2410C" stroke-width="2" marker-end="url(#aho)"/><text x="440" y="736.0" font-size="13" fill="#C2410C" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Không</text><rect x="520" y="712" width="460" height="76" rx="8" fill="#FFEDD5" stroke="#C2410C" stroke-width="1.5"/><text x="750" y="740.2" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Lỗi DNS: ipconfig /flushdns, đặt DNS</text><text x="750" y="759.8" font-size="14" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">8.8.8.8 hoặc 1.1.1.1</text><line x1="250" y1="807" x2="250" y2="843" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><text x="262" y="825.0" font-size="13" fill="#15803D" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Có</text><rect x="60" y="845" width="380" height="90" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="1.5"/><text x="250.0" y="871.7" font-size="16" fill="#15803D" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Đường truyền thông suốt</text><text x="250.0" y="890.9" font-size="14" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">kiểm tra trình duyệt, proxy, VPN,</text><text x="250.0" y="909.1" font-size="14" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">phần mềm diệt virus</text></svg>