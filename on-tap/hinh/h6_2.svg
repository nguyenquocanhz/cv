<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" font-family="'Liberation Sans', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><rect width="1040" height="520" fill="#ffffff"/><text x="165" y="32.0" font-size="15" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Mô hình OSI (7 tầng)</text><text x="430" y="32.0" font-size="15" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">TCP/IP (4 tầng)</text><text x="700" y="32.0" font-size="15" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Giao thức · thiết bị tiêu biểu</text><text x="955" y="32.0" font-size="15" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Đơn vị dữ liệu</text><rect x="20" y="60" width="290" height="56" rx="6" fill="#1F4E79" stroke="none" stroke-width="0"/><text x="44" y="88.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">7</text><text x="70" y="79.0" font-size="15" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Ứng dụng</text><text x="70" y="99.0" font-size="12" fill="#fff" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Application</text><rect x="20" y="122" width="290" height="56" rx="6" fill="#245A8C" stroke="none" stroke-width="0"/><text x="44" y="150.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">6</text><text x="70" y="141.0" font-size="15" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Trình diễn</text><text x="70" y="161.0" font-size="12" fill="#fff" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Presentation</text><rect x="20" y="184" width="290" height="56" rx="6" fill="#2B6CB0" stroke="none" stroke-width="0"/><text x="44" y="212.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">5</text><text x="70" y="203.0" font-size="15" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Phiên</text><text x="70" y="223.0" font-size="12" fill="#fff" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Session</text><rect x="20" y="246" width="290" height="56" rx="6" fill="#3B82F6" stroke="none" stroke-width="0"/><text x="44" y="274.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">4</text><text x="70" y="265.0" font-size="15" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Giao vận</text><text x="70" y="285.0" font-size="12" fill="#fff" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Transport</text><rect x="20" y="308" width="290" height="56" rx="6" fill="#60A5FA" stroke="none" stroke-width="0"/><text x="44" y="336.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">3</text><text x="70" y="327.0" font-size="15" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Mạng</text><text x="70" y="347.0" font-size="12" fill="#fff" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Network</text><rect x="20" y="370" width="290" height="56" rx="6" fill="#93C5FD" stroke="none" stroke-width="0"/><text x="44" y="398.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">2</text><text x="70" y="389.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Liên kết dữ liệu</text><text x="70" y="409.0" font-size="12" fill="#1B2A4A" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Data Link</text><rect x="20" y="432" width="290" height="56" rx="6" fill="#BFDBFE" stroke="none" stroke-width="0"/><text x="44" y="460.0" font-size="20" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">1</text><text x="70" y="451.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Vật lý</text><text x="70" y="471.0" font-size="12" fill="#1B2A4A" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Physical</text><rect x="330" y="60" width="200" height="180" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="430.0" y="149.9" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Ứng dụng</text><rect x="550" y="60" width="300" height="180" rx="6" fill="#fff" stroke="#BFBFBF" stroke-width="1"/><text x="700" y="140.9" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">HTTP/HTTPS, DNS, DHCP, FTP,</text><text x="700" y="159.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">SMTP, SSH, RDP</text><rect x="870" y="60" width="150" height="180" rx="8" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1.5"/><text x="945.0" y="149.9" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Dữ liệu</text><rect x="330" y="246" width="200" height="56" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="430.0" y="273.9" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Giao vận</text><rect x="550" y="246" width="300" height="56" rx="6" fill="#fff" stroke="#BFBFBF" stroke-width="1"/><text x="700" y="264.9" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">TCP (tin cậy), UDP (nhanh)</text><text x="700" y="283.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">— số cổng (port)</text><rect x="870" y="246" width="150" height="56" rx="8" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1.5"/><text x="945.0" y="273.9" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Segment</text><rect x="330" y="308" width="200" height="56" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="430.0" y="335.9" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Internet</text><rect x="550" y="308" width="300" height="56" rx="6" fill="#fff" stroke="#BFBFBF" stroke-width="1"/><text x="700" y="326.9" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">IP, ICMP (lệnh ping)</text><text x="700" y="345.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">— router</text><rect x="870" y="308" width="150" height="56" rx="8" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1.5"/><text x="945.0" y="335.9" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Packet (gói)</text><rect x="330" y="370" width="200" height="118" rx="8" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1.5"/><text x="430.0" y="428.9" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Truy cập mạng</text><rect x="550" y="370" width="300" height="118" rx="6" fill="#fff" stroke="#BFBFBF" stroke-width="1"/><text x="700" y="419.9" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">Ethernet, Wi-Fi, địa chỉ MAC — switch</text><text x="700" y="438.1" font-size="13" fill="#1F2937" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">cáp đồng, cáp quang, RJ45 — hub</text><rect x="870" y="370" width="150" height="118" rx="8" fill="#F2F2F2" stroke="#BFBFBF" stroke-width="1.5"/><text x="945.0" y="428.9" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Frame · Bit</text><text x="520" y="508.0" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="italic" dominant-baseline="central">Mẹo nhớ OSI từ tầng 1 lên 7: "Please Do Not Throw Sausage Pizza Away".</text></svg>