<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="'Liberation Sans', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><rect width="1040" height="400" fill="#ffffff"/><rect x="20" y="20" width="620" height="360" rx="10" fill="#F1F5F9" stroke="#BFBFBF" stroke-width="1"/><rect x="60" y="120" width="170" height="170" rx="6" fill="#F2F2F2" stroke="#1F4E79" stroke-width="1.5"/><text x="145" y="195.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Socket</text><text x="145" y="215.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">CPU</text><rect x="290" y="62" width="30" height="270" rx="4" fill="#fff" stroke="#1F4E79" stroke-width="1.5"/><text x="305" y="45.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">A1</text><rect x="360" y="62" width="30" height="270" rx="4" fill="#2563EB" stroke="#1F4E79" stroke-width="1.5"/><text x="375" y="197.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central" transform="rotate(-90 375 197)">RAM</text><text x="375" y="45.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">A2</text><rect x="430" y="62" width="30" height="270" rx="4" fill="#fff" stroke="#1F4E79" stroke-width="1.5"/><text x="445" y="45.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">B1</text><rect x="500" y="62" width="30" height="270" rx="4" fill="#2563EB" stroke="#1F4E79" stroke-width="1.5"/><text x="515" y="197.0" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central" transform="rotate(-90 515 197)">RAM</text><text x="515" y="45.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">B2</text><line x1="290" y1="348" x2="390" y2="348" stroke="#1F4E79" stroke-width="2"/><text x="340" y="364.0" font-size="13" fill="#1F4E79" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Kênh A</text><line x1="430" y1="348" x2="530" y2="348" stroke="#1F4E79" stroke-width="2"/><text x="480" y="364.0" font-size="13" fill="#1F4E79" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Kênh B</text><text x="145" y="318.0" font-size="12" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="italic" dominant-baseline="central">gần CPU nhất → xa dần</text><line x1="235" y1="205" x2="285" y2="205" stroke="#52514E" stroke-width="1.5" marker-end="url(#ahm)"/><text x="670" y="45.0" font-size="17" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Cách cắm phổ biến</text><rect x="670" y="74" width="90" height="32" rx="6" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1"/><text x="715" y="90.0" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">1 thanh</text><text x="772" y="90.0" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">cắm khe A2</text><rect x="670" y="118" width="90" height="32" rx="6" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1"/><text x="715" y="134.0" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">2 thanh</text><text x="772" y="134.0" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">cắm A2 + B2 → chạy kênh đôi</text><rect x="670" y="162" width="90" height="32" rx="6" fill="#DBEAFE" stroke="#1F4E79" stroke-width="1"/><text x="715" y="178.0" font-size="14" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">4 thanh</text><text x="772" y="178.0" font-size="14" fill="#1F2937" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">cắm đủ bốn khe</text><text x="670" y="231.2" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Kênh đôi nhân đôi băng thông lý thuyết.</text><text x="670" y="250.0" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">Nên dùng 2 thanh giống nhau, tốt nhất</text><text x="670" y="268.9" font-size="13" fill="#1F2937" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">mua nguyên kit.</text><text x="670" y="325.6" font-size="13" fill="#C2410C" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">Thứ tự khe tuỳ hãng — luôn đối chiếu</text><text x="670" y="344.4" font-size="13" fill="#C2410C" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">sách hướng dẫn mainboard.</text></svg>