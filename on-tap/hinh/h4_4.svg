<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="450" viewBox="0 0 1040 450" font-family="'Liberation Sans', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><rect width="1040" height="450" fill="#ffffff"/><path d="M60,40 H310 L360,90 V430 H60 Z" fill="#1F2937" stroke="#111827" stroke-width="2"/><rect x="60" y="290" width="300" height="56" rx="0" fill="#B91C1C" stroke="#B91C1C" stroke-width="0"/><text x="84" y="100.0" font-size="44" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">64GB</text><text x="84" y="150.0" font-size="30" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">SDXC</text><rect x="210" y="130" width="38" height="40" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/><text x="229" y="150.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">I</text><circle cx="110" cy="225" r="26" fill="none" stroke="#fff" stroke-width="3"/><rect x="122" y="210" width="16" height="30" fill="#1F2937"/><text x="112" y="226.0" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">10</text><path d="M164,200 V238 Q164,252 180,252 H196 Q212,252 212,238 V200" fill="none" stroke="#fff" stroke-width="4"/><text x="188" y="228.0" font-size="22" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">3</text><text x="232" y="226.0" font-size="26" fill="#fff" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">V30</text><rect x="298" y="206" width="44" height="40" rx="4" fill="none" stroke="#fff" stroke-width="2.5"/><text x="320" y="226.0" font-size="20" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">A2</text><text x="210" y="318.0" font-size="26" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">170MB/s</text><circle cx="190" cy="150" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="190" y="150.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">1</text><circle cx="260" cy="132" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="260" y="132.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">2</text><circle cx="82" cy="200" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="82" y="200.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">3</text><circle cx="188" cy="190" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="188" y="190.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">4</text><circle cx="250" cy="256" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="250" y="256.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">5</text><circle cx="350" cy="256" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="350" y="256.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">6</text><circle cx="322" cy="300" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="322" y="300.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">7</text><circle cx="420" cy="55" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="420" y="55.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">1</text><text x="442" y="45.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">SDXC — nhóm dung lượng</text><text x="442" y="66.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">SD ≤ 2 GB · SDHC 2–32 GB · SDXC 32 GB–2 TB · SDUC 2–128 TB</text><circle cx="420" cy="111" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="420" y="111.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">2</text><text x="442" y="101.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">I — bus UHS-I</text><text x="442" y="122.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">băng thông bus tối đa 104 MB/s; II = UHS-II (312 MB/s)</text><circle cx="420" cy="167" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="420" y="167.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">3</text><text x="442" y="157.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">C10 — Speed Class 10</text><text x="442" y="178.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">tốc độ ghi tối thiểu 10 MB/s</text><circle cx="420" cy="223" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="420" y="223.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">4</text><text x="442" y="213.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">U3 — UHS Speed Class 3</text><text x="442" y="234.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">tốc độ ghi tối thiểu 30 MB/s (U1 = 10 MB/s)</text><circle cx="420" cy="279" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="420" y="279.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">5</text><text x="442" y="269.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">V30 — Video Speed Class</text><text x="442" y="290.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">ghi tối thiểu 30 MB/s, đủ cho quay video 4K</text><circle cx="420" cy="335" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="420" y="335.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">6</text><text x="442" y="325.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">A2 — App Performance</text><text x="442" y="346.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">≥ 4.000 IOPS đọc / 2.000 IOPS ghi: điện thoại, máy chơi game</text><circle cx="420" cy="391" r="12" fill="#2563EB" stroke="#fff" stroke-width="2"/><text x="420" y="391.5" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">7</text><text x="442" y="381.0" font-size="15" fill="#1B2A4A" text-anchor="start" font-weight="bold" font-style="normal" dominant-baseline="central">170MB/s — tốc độ đọc tối đa</text><text x="442" y="402.0" font-size="13" fill="#52514E" text-anchor="start" font-weight="normal" font-style="normal" dominant-baseline="central">theo hãng, thường cần đầu đọc của chính hãng đó</text></svg>