<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="'Liberation Sans', Arial, 'DejaVu Sans', sans-serif"><defs><marker id="ahn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><marker id="aha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514E"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"/></marker></defs><rect width="1040" height="400" fill="#ffffff"/><rect x="20" y="30" width="320" height="230" rx="10" fill="#fff" stroke="#1F4E79" stroke-width="2"/><text x="180" y="56.0" font-size="17" fill="#1F4E79" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">CPU — Bộ xử lý trung tâm</text><rect x="40" y="78" width="280" height="50" rx="8" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="180.0" y="95.1" font-size="15" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">CU — Khối điều khiển</text><text x="180.0" y="112.4" font-size="12" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">giải mã lệnh, điều phối</text><rect x="40" y="138" width="280" height="50" rx="8" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="180.0" y="155.1" font-size="15" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">ALU — Khối số học &amp; logic</text><text x="180.0" y="172.4" font-size="12" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">cộng, trừ, so sánh</text><rect x="40" y="198" width="280" height="50" rx="8" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="180.0" y="215.1" font-size="15" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Thanh ghi &amp; cache</text><text x="180.0" y="232.4" font-size="12" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">vùng nhớ nhanh nhất</text><rect x="360" y="30" width="170" height="230" rx="8" fill="#EBF5FB" stroke="#1F4E79" stroke-width="1.5"/><text x="445.0" y="109.6" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Bộ nhớ chính</text><text x="445.0" y="129.6" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">(RAM)</text><text x="445.0" y="148.1" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">chứa cả lệnh</text><text x="445.0" y="165.0" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">và dữ liệu</text><text x="445.0" y="181.9" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">đang xử lý</text><rect x="550" y="30" width="150" height="230" rx="8" fill="#F2F2F2" stroke="#1F4E79" stroke-width="1.5"/><text x="625.0" y="128.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Thiết bị vào</text><text x="625.0" y="146.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">bàn phím, chuột,</text><text x="625.0" y="163.4" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">máy quét</text><rect x="720" y="30" width="150" height="230" rx="8" fill="#F2F2F2" stroke="#1F4E79" stroke-width="1.5"/><text x="795.0" y="128.0" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Thiết bị ra</text><text x="795.0" y="146.5" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">màn hình, loa,</text><text x="795.0" y="163.4" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">máy in</text><rect x="890" y="30" width="130" height="230" rx="8" fill="#F2F2F2" stroke="#1F4E79" stroke-width="1.5"/><text x="955.0" y="119.6" font-size="16" fill="#1B2A4A" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">Lưu trữ</text><text x="955.0" y="138.1" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">SSD, HDD —</text><text x="955.0" y="155.0" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">giữ dữ liệu</text><text x="955.0" y="171.9" font-size="13" fill="#52514E" text-anchor="middle" font-weight="normal" font-style="normal" dominant-baseline="central">khi tắt máy</text><rect x="20" y="310" width="1000" height="56" rx="8" fill="#1F4E79" stroke="#1F4E79" stroke-width="1"/><text x="520" y="338.0" font-size="16" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal" dominant-baseline="central">BUS HỆ THỐNG  ·  bus địa chỉ  ·  bus dữ liệu  ·  bus điều khiển</text><line x1="180" y1="262" x2="180" y2="306" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)" marker-start="url(#ahn)"/><line x1="445" y1="262" x2="445" y2="306" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)" marker-start="url(#ahn)"/><line x1="625" y1="262" x2="625" y2="306" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><line x1="795" y1="306" x2="795" y2="264" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)"/><line x1="955" y1="262" x2="955" y2="306" stroke="#1F4E79" stroke-width="2" marker-end="url(#ahn)" marker-start="url(#ahn)"/></svg>